<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Nested Azure Landing Zone health model topology</title>
  <desc id="description">The platform health model root rolls up four groups containing seven discovery domains.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #5d6b82; }
      .eyebrow { font-size: 12px; font-weight: 700; fill: #2563eb; letter-spacing: 1.2px; }
      .root-title { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .root-subtitle { font-size: 13px; fill: #dbeafe; }
      .group-title { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .group-subtitle { font-size: 12px; fill: #ccfbf1; }
      .domain-title { font-size: 15px; font-weight: 700; fill: #24324a; }
      .domain-subtitle { font-size: 12px; fill: #66748c; }
      .chip { font-size: 13px; font-weight: 600; fill: #34425a; }
      .status { font-size: 12px; font-weight: 700; fill: #166534; }
      .connector { fill: none; stroke: #8aa4c8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .branch { fill: none; stroke: #a5b5cd; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#334155" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8aa4c8" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f5f7fb" />

  <text class="eyebrow" x="64" y="62">AZURE MONITOR HEALTH MODELS</text>
  <text class="title" x="64" y="102">Azure Landing Zone health at a glance</text>
  <text class="subtitle" x="64" y="133">A nested view of platform foundations, operations, observability, and workload health.</text>

  <rect x="1216" y="54" width="96" height="36" rx="18" fill="#e8eef8" />
  <text class="chip" x="1264" y="77" text-anchor="middle">4 groups</text>
  <rect x="1324" y="54" width="104" height="36" rx="18" fill="#e8eef8" />
  <text class="chip" x="1376" y="77" text-anchor="middle">7 domains</text>
  <rect x="1440" y="54" width="96" height="36" rx="18" fill="#dcfce7" />
  <circle cx="1460" cy="72" r="5" fill="#22c55e" />
  <text class="status" x="1495" y="77" text-anchor="middle">Healthy</text>

  <rect x="64" y="166" width="1472" height="770" rx="18" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)" />

  <!-- Root -->
  <rect x="600" y="202" width="400" height="82" rx="14" fill="#2563eb" filter="url(#shadow)" />
  <circle cx="638" cy="243" r="15" fill="#60a5fa" />
  <path d="M630 243 L636 249 L647 236" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="root-title" x="670" y="239">Platform health model</text>
  <text class="root-subtitle" x="670" y="262">ahm-alz-platform · WorstOf rollup</text>

  <!-- Root distribution bus, entirely above group headers -->
  <path class="connector" d="M800 284 V318 H237 V352" marker-end="url(#arrow)" />
  <path class="connector" d="M800 318 H612 V352" marker-end="url(#arrow)" />
  <path class="connector" d="M800 318 H987 V352" marker-end="url(#arrow)" />
  <path class="connector" d="M800 318 H1362 V352" marker-end="url(#arrow)" />

  <!-- Lanes -->
  <rect x="82" y="352" width="310" height="542" rx="14" fill="#f8fafc" stroke="#dbe3ef" />
  <rect x="457" y="352" width="310" height="542" rx="14" fill="#f8fafc" stroke="#dbe3ef" />
  <rect x="832" y="352" width="310" height="542" rx="14" fill="#f8fafc" stroke="#dbe3ef" />
  <rect x="1207" y="352" width="310" height="542" rx="14" fill="#f8fafc" stroke="#dbe3ef" />

  <!-- Group headers -->
  <rect x="82" y="352" width="310" height="78" rx="14" fill="#0f766e" />
  <text class="group-title" x="106" y="383">Platform foundations</text>
  <text class="group-subtitle" x="106" y="405">Security, connectivity, and identity</text>

  <rect x="457" y="352" width="310" height="78" rx="14" fill="#0f766e" />
  <text class="group-title" x="481" y="383">Platform operations</text>
  <text class="group-subtitle" x="481" y="405">Management and governance</text>

  <rect x="832" y="352" width="310" height="78" rx="14" fill="#0f766e" />
  <text class="group-title" x="856" y="383">Observability</text>
  <text class="group-subtitle" x="856" y="405">Monitoring and diagnostic coverage</text>

  <rect x="1207" y="352" width="310" height="78" rx="14" fill="#0f766e" />
  <text class="group-title" x="1231" y="383">Landing zones</text>
  <text class="group-subtitle" x="1231" y="405">Common workload resource health</text>

  <!-- Foundation branch rail -->
  <path class="branch" d="M110 430 V738 M110 497 H132 M110 607 H132 M110 717 H132" />
  <rect x="132" y="462" width="236" height="70" rx="10" fill="#ffffff" stroke="#c9d5e6" />
  <circle cx="154" cy="486" r="7" fill="#22c55e" />
  <text class="domain-title" x="172" y="491">Security</text>
  <text class="domain-subtitle" x="154" y="514">discover-security</text>

  <rect x="132" y="572" width="236" height="70" rx="10" fill="#ffffff" stroke="#c9d5e6" />
  <circle cx="154" cy="596" r="7" fill="#22c55e" />
  <text class="domain-title" x="172" y="601">Connectivity</text>
  <text class="domain-subtitle" x="154" y="624">discover-connectivity</text>

  <rect x="132" y="682" width="236" height="70" rx="10" fill="#ffffff" stroke="#c9d5e6" />
  <circle cx="154" cy="706" r="7" fill="#22c55e" />
  <text class="domain-title" x="172" y="711">Identity</text>
  <text class="domain-subtitle" x="154" y="734">discover-identity</text>

  <!-- Operations branch rail -->
  <path class="branch" d="M485 430 V628 M485 497 H507 M485 607 H507" />
  <rect x="507" y="462" width="236" height="70" rx="10" fill="#ffffff" stroke="#c9d5e6" />
  <circle cx="529" cy="486" r="7" fill="#22c55e" />
  <text class="domain-title" x="547" y="491">Management</text>
  <text class="domain-subtitle" x="529" y="514">discover-management</text>

  <rect x="507" y="572" width="236" height="70" rx="10" fill="#ffffff" stroke="#c9d5e6" />
  <circle cx="529" cy="596" r="7" fill="#22c55e" />
  <text class="domain-title" x="547" y="601">Governance</text>
  <text class="domain-subtitle" x="529" y="624">discover-governance</text>

  <!-- Observability child -->
  <path class="branch" d="M860 430 V497 H882" />
  <rect x="882" y="462" width="236" height="70" rx="10" fill="#ffffff" stroke="#c9d5e6" />
  <circle cx="904" cy="486" r="7" fill="#22c55e" />
  <text class="domain-title" x="922" y="491">Monitoring services</text>
  <text class="domain-subtitle" x="904" y="514">discover-observability</text>

  <!-- Workloads child -->
  <path class="branch" d="M1235 430 V497 H1257" />
  <rect x="1257" y="462" width="236" height="70" rx="10" fill="#ffffff" stroke="#c9d5e6" />
  <circle cx="1279" cy="486" r="7" fill="#22c55e" />
  <text class="domain-title" x="1297" y="491">Workload resources</text>
  <text class="domain-subtitle" x="1279" y="514">discover-landing-zones</text>

  <!-- Footer -->
  <rect x="96" y="824" width="1408" height="48" rx="10" fill="#eef7f1" stroke="#c7ead3" />
  <circle cx="122" cy="848" r="8" fill="#22c55e" />
  <text class="status" x="142" y="853">HEALTHY ROLLUP</text>
  <text class="subtitle" x="270" y="853">Every discovery domain is connected through an explicit group entity to the model root.</text>
</svg>
