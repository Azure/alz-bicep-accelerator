<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Azure Landing Zone health model validation summary</title>
  <desc id="description">A clean validation report showing successful provider, template, topology, and compile checks.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #5d6b82; }
      .eyebrow { font-size: 12px; font-weight: 700; fill: #2563eb; letter-spacing: 1.2px; }
      .summary-number { font-size: 28px; font-weight: 700; fill: #172033; }
      .summary-label { font-size: 13px; fill: #66748c; }
      .card-title { font-size: 17px; font-weight: 700; fill: #24324a; }
      .card-text { font-size: 13px; fill: #66748c; }
      .status { font-size: 12px; font-weight: 700; fill: #166534; }
      .advisory { font-size: 12px; font-weight: 700; fill: #9a5800; }
      .terminal { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; font-size: 13px; fill: #cbd5e1; }
      .terminal-ok { font-family: "Cascadia Mono", Consolas, "Courier New", monospace; font-size: 13px; fill: #86efac; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#334155" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#f5f7fb" />

  <text class="eyebrow" x="64" y="62">DEPLOYMENT EVIDENCE</text>
  <text class="title" x="64" y="102">Health model validation summary</text>
  <text class="subtitle" x="64" y="133">Non-destructive Azure validation and local compilation evidence for the nested ALZ topology.</text>

  <!-- Summary -->
  <rect x="64" y="168" width="1472" height="116" rx="16" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)" />
  <rect x="92" y="192" width="260" height="68" rx="12" fill="#eef7f1" />
  <circle cx="120" cy="226" r="10" fill="#22c55e" />
  <text class="summary-number" x="144" y="224">5</text>
  <text class="summary-label" x="144" y="246">checks passed</text>

  <rect x="372" y="192" width="260" height="68" rx="12" fill="#fff7e8" />
  <circle cx="400" cy="226" r="10" fill="#f59e0b" />
  <text class="summary-number" x="424" y="224">1</text>
  <text class="summary-label" x="424" y="246">expected advisory</text>

  <rect x="652" y="192" width="390" height="68" rx="12" fill="#eef4ff" />
  <text class="summary-label" x="676" y="218">Validation boundary</text>
  <text class="card-title" x="676" y="243">Azure Resource Manager + Bicep CLI</text>

  <rect x="1062" y="192" width="446" height="68" rx="12" fill="#f3f5f9" />
  <text class="summary-label" x="1086" y="218">Deployment mode</text>
  <text class="card-title" x="1086" y="243">Validate and what-if (no resources created)</text>

  <!-- Validation cards -->
  <rect x="64" y="316" width="920" height="554" rx="16" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)" />
  <text class="card-title" x="92" y="354">Validation checks</text>

  <rect x="92" y="380" width="412" height="128" rx="12" fill="#f8fafc" stroke="#dbe3ef" />
  <circle cx="120" cy="411" r="10" fill="#22c55e" />
  <text class="status" x="142" y="416">PASSED</text>
  <text class="card-title" x="120" y="451">CloudHealth provider</text>
  <text class="card-text" x="120" y="477">Provider registration state returned Registered.</text>

  <rect x="532" y="380" width="412" height="128" rx="12" fill="#f8fafc" stroke="#dbe3ef" />
  <circle cx="560" cy="411" r="10" fill="#22c55e" />
  <text class="status" x="582" y="416">PASSED</text>
  <text class="card-title" x="560" y="451">ARM validation</text>
  <text class="card-text" x="560" y="477">Subscription deployment validation succeeded.</text>

  <rect x="92" y="532" width="412" height="128" rx="12" fill="#f8fafc" stroke="#dbe3ef" />
  <circle cx="120" cy="563" r="10" fill="#22c55e" />
  <text class="status" x="142" y="568">PASSED</text>
  <text class="card-title" x="120" y="603">Nested topology</text>
  <text class="card-text" x="120" y="629">What-if found group entities and both relationship tiers.</text>

  <rect x="532" y="532" width="412" height="128" rx="12" fill="#f8fafc" stroke="#dbe3ef" />
  <circle cx="560" cy="563" r="10" fill="#22c55e" />
  <text class="status" x="582" y="568">PASSED</text>
  <text class="card-title" x="560" y="603">Bicep compilation</text>
  <text class="card-text" x="560" y="629">24 templates built with zero failures.</text>

  <rect x="92" y="684" width="412" height="128" rx="12" fill="#f8fafc" stroke="#dbe3ef" />
  <circle cx="120" cy="715" r="10" fill="#22c55e" />
  <text class="status" x="142" y="720">PASSED</text>
  <text class="card-title" x="120" y="755">Rendered parameters</text>
  <text class="card-text" x="120" y="781">Token-resolved parameter file compiled successfully.</text>

  <rect x="532" y="684" width="412" height="128" rx="12" fill="#fffaf0" stroke="#f0d39b" />
  <circle cx="560" cy="715" r="10" fill="#f59e0b" />
  <text class="advisory" x="582" y="720">EXPECTED</text>
  <text class="card-title" x="560" y="755">Role assignment analysis</text>
  <text class="card-text" x="560" y="781">What-if cannot resolve the new identity principal before deploy.</text>

  <!-- Terminal evidence, lines sized to remain inside the panel -->
  <rect x="1016" y="316" width="520" height="554" rx="16" fill="#111827" filter="url(#shadow)" />
  <rect x="1016" y="316" width="520" height="44" rx="16" fill="#1f2937" />
  <circle cx="1044" cy="338" r="6" fill="#ef4444" />
  <circle cx="1064" cy="338" r="6" fill="#f59e0b" />
  <circle cx="1084" cy="338" r="6" fill="#22c55e" />
  <text class="terminal" x="1110" y="343">validation-output.txt</text>

  <text class="terminal" x="1044" y="400">$ az provider show ...</text>
  <text class="terminal-ok" x="1044" y="426">Registered</text>

  <text class="terminal" x="1044" y="474">$ az deployment sub validate ...</text>
  <text class="terminal-ok" x="1044" y="500">VALIDATE_OK</text>

  <text class="terminal" x="1044" y="548">$ az deployment sub what-if ...</text>
  <text class="terminal-ok" x="1044" y="574">+ entities/group-foundations</text>
  <text class="terminal-ok" x="1044" y="600">+ relationships/root-to-group-foundations</text>
  <text class="terminal-ok" x="1044" y="626">+ relationships/group-foundations-to-discover-security</text>
  <text class="terminal" x="1044" y="652">26 to create, 1 unsupported</text>

  <text class="terminal" x="1044" y="710">$ bicep build ...</text>
  <text class="terminal-ok" x="1044" y="736">MAIN_BUILD=OK</text>
  <text class="terminal-ok" x="1044" y="762">BICEP_TOTAL=24  BICEP_FAILED=0</text>

  <text class="terminal" x="1044" y="820">No resources were created by these checks.</text>

  <!-- Bottom note -->
  <rect x="64" y="894" width="1472" height="42" rx="10" fill="#eef4ff" stroke="#d5e2f7" />
  <text class="card-text" x="88" y="920">Result: the authored root → group → discovery topology is accepted by ARM and appears correctly in the deployment plan.</text>
</svg>
