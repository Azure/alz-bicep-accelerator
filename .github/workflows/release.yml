---
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Generate Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.1

      - name: Zip and Tar
        run: |
          mkdir staging
          cp -r templates staging/templates
          cp -r tests staging/tests
          cp -r .config staging/.config
          cp bicepconfig.json staging/bicepconfig.json
          cd staging
          tar -cvzf ../starter_modules.tar.gz .
          zip -r ../starter_modules.zip .

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starter_modules
          path: |
            starter_modules.tar.gz
            starter_modules.zip

      - name: Check for Valid Git Ref
        if: github.event_name != 'pull_request'
        run: |
          $gitRef = "${{ github.ref }}"
          if (!$gitRef.StartsWith("refs/tags/")) {
            Write-Error "Invalid Git ref $gitRef"
            exit 1
          } else {
            Write-Output "Valid Git ref $gitRef"
          }
        shell: pwsh

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./starter_modules.tar.gz
            ./starter_modules.zip
